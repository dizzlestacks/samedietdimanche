<!DOCTYPE html>
<html lang="en">
<head>
  <script src="js/preorder-access.js?v=38"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Samedi Et Dimanche — WHERE THE WEEK ENDS. Shop Collection.">
  <meta name="author" content="Damion Wright">
  <meta name="keywords" content="samedi, dimanche, samedietdimanche, luxury, clothing, shop">
  <meta property="og:title" content="SHOP — SAMEDI ET DIMANCHE">
  <meta property="og:description" content="WHERE THE WEEK ENDS. Shop Collection.">
  <meta property="og:image" content="img/favicon.png">
  <meta property="og:type" content="website">
  <title>SHOP — SAMEDI ET DIMANCHE</title>

  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="180x180" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/waitlist.css">
  <link rel="stylesheet" href="css/cart.css?v=28">
  <link rel="stylesheet" href="css/product.css?v=28">
  <link rel="canonical" href="https://www.samedietdimanche.com/shop.html">
  <link rel="stylesheet" href="css/site-brand.css?v=34">
  <link rel="stylesheet" href="css/shop-brand.css?v=35">
  <link rel="stylesheet" href="css/preorders.css?v=38">
</head>
<body class="shop-page">

  <div id="page-transition"></div>
  <div class="noise"></div>
  <div id="petals"></div>

  <main class="waitlist-page">

    <a href="index.html" class="wl-logo animate-in" style="--delay:0s; text-decoration:none;">
      <img src="img/newlogo.png" alt="Samedi Et Dimanche" class="logo">
    </a>
    <aside id="preorder-notice" data-preorder-scope="shop" role="status" aria-live="polite" hidden></aside>

    <div class="wl-cta-text animate-in" style="--delay: 0.25s">
      <h1 class="wl-cta-headline">The Collection</h1>
      <p class="wl-cta-sub">Numbered pieces &mdash; secured in order of purchase</p>
    </div>

    <section id="shop-waitlist" aria-label="Shop email waitlist" hidden>
      <p class="wl-cta-sub">By joining, you agree to receive shop collection updates and private preorder invitations by email.</p>
      <form id="shop-waitlist-form" class="wl-form">
        <label for="shop-waitlist-email">Email address</label>
        <div class="wl-input-wrap">
          <input type="email" id="shop-waitlist-email" class="wl-input" name="email" autocomplete="email" maxlength="254" placeholder="Your email address" required>
          <button type="submit" class="wl-btn">Join the waitlist</button>
        </div>
      </form>
      <p id="shop-waitlist-status" class="preorder-status" role="status" aria-live="polite"></p>
    </section>
    <div id="shop-grid" class="watch-shop"></div>
    <p data-cart-notice role="status"></p><p id="shop-cart-status" role="status"></p>

  </main>

  <footer class="wl-footer animate-in" style="--delay: 0.7s">
    <p class="copyright">&copy; <span id="year"></span> &nbsp;Samedi Et Dimanche</p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
  <script src="js/rose-petals.js"></script>
  <script src="js/site-extras.js"></script>
  <script src="js/shared-cart.js?v=30"></script>
  <script src="js/cart-nav.js?v=29"></script>
  <script src="js/preorder-notice.js?v=56"></script>
  <script src="js/shop-page.js?v=38"></script>
  <script src="js/site-cart.js?v=29"></script>
</body>
</html>
